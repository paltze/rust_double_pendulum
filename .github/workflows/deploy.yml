name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM in release mode
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Bundle Web Assets
        run: |
          if [ ! -f dist/mq_js_bundle.js ]; then
            curl -sSL https://raw.githubusercontent.com/not-fl3/macroquad/master/miniquad-js/mq_js_bundle.js -o dist/mq_js_bundle.js
          fi
          cp target/wasm32-unknown-unknown/release/*.wasm dist/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4